name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: project-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter código
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configurar pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Configurar Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@arcsyn-io'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconstruir dependências nativas permitidas
        run: pnpm rebuild @nestjs/core esbuild sharp

      - name: Verificar arquitetura
        run: pnpm architecture:check

      - name: Executar lint
        run: pnpm lint

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Executar testes
        run: pnpm test

      - name: Gerar build
        run: pnpm build
